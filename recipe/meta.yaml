{% set name = "tomtoolkit" %}
{% set version = "3.1.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/tomtoolkit-{{ version }}.tar.gz
  sha256: 719afa5e730955e299dfa0929b8b87f9af88c5e976239abe095ce59b63374749

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 1

requirements:
  host:
    - python {{ python_min }}
    - poetry-core >=2.0,<3.0
    - poetry-dynamic-versioning >=1.0.0,<2.0.0
    - pip
  run:
    - python >={{ python_min }}
    - alerce >=2.3.1,<3.0
    - astroplan >=0.8,<0.11
    - astropy-base >=5.3.3,<8
    - astroquery <1
    - beautifulsoup4 <5
    - crispy-bootstrap5 <2027
    - cryptography <=50.0.0
    - django >=5.2.18,<6
    - django-allauth >=65.19.7,<66
    # conda has no package extras; these two are what django-allauth[mfa] pulls in
    - fido2 >=1.1.2,<3
    - qrcode >=7.0.0,<9
    - django-bootstrap5 <27
    - django-contrib-comments >=2.0,<3.0
    - django-crispy-forms >=2.7,<3.0
    - django-extensions >=3.0.0,<4.0.0
    - django-filter >=23,<25
    - django-gravatar2 >=1.0.0,<2.0.0
    - django-guardian >=2.0.0,<3.0.0
    - django-htmx >=1.29.0,<2.0.0
    - django-tables2 >=3.0,<4
    - django-tasks >=0.6.1,<0.7.0
    - djangorestframework >=3.18.3,<4
    - fits2image >=0.4,<0.5
    - importlib-resources >=6.4.5,<6.5.0
    - markdown <4
    - numpy >1.24,<2.2
    - pillow >9.2,<13.0
    - plotly <6
    - python-dateutil <3
    - requests <3
    - specutils >=1.20.0,<3

test:
  requires:
    - python {{ python_min }}
    - pip
  imports:
    - tom_targets
    - tom_observations
  commands:
    - pip check

about:
  home: https://github.com/TOMToolkit/tom_base
  summary: TOM Toolkit and base modules
  license: GPL-2.0-or-later
  license_file: LICENSE

extra:
  recipe-maintainers:
    - miguelgomezgomez
    - davner
    - phycodurus
    - jchate6
